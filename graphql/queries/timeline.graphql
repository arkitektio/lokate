# Your phones (installs) that have backed up here.
query ListDevices($filters: DeviceFilter, $pagination: OffsetPaginationInput, $ordering: [DeviceOrder!]) {
  devices(filters: $filters, pagination: $pagination, ordering: $ordering) {
    ...DetailDevice
  }
}

# A device by id.
query GetDevice($id: ID!) {
  device(id: $id) {
    ...DetailDevice
  }
}

# Location fixes, filterable by time, device, map box or radius.
query ListPoints($filters: PointFilter, $pagination: OffsetPaginationInput, $ordering: [PointOrder!]) {
  points(filters: $filters, pagination: $pagination, ordering: $ordering) {
    ...Point
  }
}

# How many points match.
query CountPoints($filters: PointFilter) {
  pointsCount(filters: $filters)
}

# A point by id.
query GetPoint($id: ID!) {
  point(id: $id) {
    ...Point
  }
}

# Stays, filterable by time, device, place, duration, map box or radius.
query ListVisits($filters: VisitFilter, $pagination: OffsetPaginationInput, $ordering: [VisitOrder!]) {
