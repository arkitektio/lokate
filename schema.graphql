}

input DeletedInput {
  clientId: ID!
  deletedAt: DateTime!
}

"""One of your phones (an install): the token's client_device."""
type Device @key(fields: "id", resolvable: true) {
  id: ID!

  """The client_device claim it uploads with."""
  deviceId: String!
  firstSeenAt: DateTime!

  """When this device last wrote anything."""
  lastUploadAt: DateTime

  """The `from` of its last replaceSegments."""
  segmentsFrom: DateTime

  """How many points it has uploaded."""
  pointCount: Int!
}

"""
One phone (install) of a user: the ``client_device`` claim of its token.

Keyed by user as well, so two accounts on one phone never share rows. A reinstall that
is issued a new device id is a new ``Device``; its old one's history stays readable
through ``changes``.
"""
input DeviceFilter {
  AND: DeviceFilter
  OR: DeviceFilter
  NOT: DeviceFilter
  DISTINCT: Boolean
  ids: [ID!]
}

input DeviceOrder @oneOf {
  firstSeenAt: Ordering
  lastUploadAt: Ordering
}

"""The width of a stats bucket."""
enum Granularity {
  DAY
  WEEK
  MONTH
}

"""Trips of one mode within a stats bucket."""
type ModeStat {
  mode: TripMode!
  trips: Int!

  """Meters."""
  distance: Float!
  seconds: Float!
}

type Mutation {
  """
  Store points (at most 1000 per call). Safe to repeat: a point already stored counts as a duplicate.
  """
  uploadPoints(points: [PointInput!]!): UploadResult! @auth(required_scopes: ["lokate_write"], any_role_of: ["lokate_editor"])

  """
  In one transaction, make this device's visits and trips starting at or after `from` exactly the ones sent.
  """
  replaceSegments(from: DateTime!, visits: [VisitInput!]!, trips: [TripInput!]!): ReplaceResult! @auth(required_scopes: ["lokate_write"], any_role_of: ["lokate_editor"])

  """
  Merge places and tombstones, last write wins on updatedAt; newer server copies come back in `stale`.
  """
  syncPlaces(places: [PlaceInput!]!, deleted: [DeletedInput!]!): PlaceSyncResult! @auth(required_scopes: ["lokate_write"], any_role_of: ["lokate_editor"])

  """
  Delete all of your data on this server (confirm = "DELETE"). Returns how many points, visits, trips and places were deleted.
  """
  deleteServerCopy(confirm: String!): Int! @auth(required_scopes: ["lokate_write"], any_role_of: ["lokate_editor"])

  """
  Put one of your visits (with the place it was matched to), trips or places in a collaboration (lok's, by its key) for its guests to read. Never a location fix or a device. The first thing put in makes lokate's row of the collaboration.
  """
  addToCollaboration(input: CollaborationObjectInput!): Collaboration! @auth(required_scopes: ["lokate_share"], any_role_of: ["lokate_editor"])

  """
  Put several of your visits, trips or places in a collaboration at once; all or none.
  """
  addManyToCollaboration(input: AddManyToCollaborationInput!): Collaboration! @auth(required_scopes: ["lokate_share"], any_role_of: ["lokate_editor"])

  """
  Put what a workflow (its root task) created in lokate in a collaboration. A timeline is backed up by phones, not made by workflows: every structure is reported unknown and nothing is put in.
  """
  shareWorkflow(input: ShareWorkflowInput!): WorkflowShare! @auth(required_scopes: ["lokate_share"], any_role_of: ["lokate_editor"])

  """
  Take a visit, trip or place out of a collaboration, with what it brought that nothing else there needs.
  """
  removeFromCollaboration(input: CollaborationObjectInput!): Collaboration! @auth(required_scopes: ["lokate_share"], any_role_of: ["lokate_editor"])

  """
  Take everything lokate holds in a collaboration (by its key) out of it: its guests read none of it here any more. lok's collaboration and its grants stay.
  """
  deleteCollaboration(key: ID!): ID! @auth(required_scopes: ["lokate_share"], any_role_of: ["lokate_editor"])
}

"""Within `radius` meters of a point."""
input NearInput {
  lat: Float!
  lon: Float!
  radius: Float!
}

input OffsetPaginationInput {
  offset: Int! = 0
  limit: Int
}

enum Ordering {
  ASC
  ASC_NULLS_FIRST
  ASC_NULLS_LAST
  DESC
  DESC_NULLS_FIRST
  DESC_NULLS_LAST
}

"""A named place, shared by all of your phones."""
type Place @key(fields: "id", resolvable: true) @identified(by: "@lokate/place") {
  id: ID!
  clientId: ID!
  name: String
  lat: Float
  lon: Float

  """Meters."""
  radius: Float

  """The phone's edit time; last write wins on it."""
  updatedAt: DateTime!

  """Set on a tombstone (only ever seen in syncPlaces' `stale`)."""
  deletedAt: DateTime

  """How many visits were matched to it."""
  visitCount: Int!

  """When the latest visit to it ended."""
  lastVisitAt: DateTime
}

"""
A named place, shared by all of a user's phones (so keyed by user, not device).

Last write wins on ``updated_at``. A deleted place stays as a tombstone (``deleted_at``
set) so another phone's older copy is not uploaded again. A tombstone can arrive for a
place the server never saw, so everything but the key and the stamps is nullable.
"""
input PlaceFilter {
  """
  Only what is in this collaboration (its key): put in, or part of what was
  """
  inCollaboration: ID

  """Only what the workflow (its root task id) created"""
  createdUnder: ID
  AND: PlaceFilter
  OR: PlaceFilter
  NOT: PlaceFilter
  DISTINCT: Boolean
  ids: [ID!]
  search: String
  inBox: BoxInput
  near: NearInput
}

input PlaceInput {
  clientId: ID!
  name: String!
  lat: Float!
  lon: Float!
  radius: Float!
  updatedAt: DateTime!
}

input PlaceOrder @oneOf {
  name: Ordering
  updatedAt: Ordering
}

"""Time spent at one place."""
type PlaceStat {
  placeClientId: ID!

  """None if the place was deleted."""
  place: Place
  visitCount: Int!
  seconds: Float!
  firstVisitAt: DateTime!
  lastVisitAt: DateTime!
}

type PlaceSyncResult {
  applied: Int!

  """
  Places whose server copy is newer; the phone takes them (deletedAt set: delete it).
  """
  stale: [Place!]!

  """
  The server's copy of every place sent, after the merge (ones a tombstone kept deleted left out).
  """
  places: [Place!]!
}

"""One location fix."""
type Point @key(fields: "id", resolvable: true) {
