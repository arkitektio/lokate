  OR: PointFilter
  NOT: PointFilter
  DISTINCT: Boolean
  devices: [ID!]
  since: DateTime
  until: DateTime
  inBox: BoxInput
  near: NearInput
  maxAccuracy: Float
}

input PointInput {
  clientId: ID!
  ts: DateTime!
  lat: Float!
  lon: Float!
  acc: Float = null
  speed: Float = null
  heading: Float = null
  alt: Float = null
}

input PointOrder @oneOf {
  ts: Ordering
}

type Query {
  _entities(representations: [_Any!]!): [_Entity]!
  _service: _Service!

  """
  The organization's collaborations lokate holds visits, trips or places in (a guest: the ones granted to them).
  """
  collaborations(pagination: OffsetPaginationInput = null): [Collaboration!]! @auth(required_scopes: ["lokate_read"])

  """What lokate holds in a collaboration, by its key (lok's)."""
  collaboration(key: ID!): Collaboration! @auth(required_scopes: ["lokate_read"])

  """
  Count the collaborations `collaborations` lists, and the objects in them.
  """
  collaborationsStats: CollaborationStats! @auth(required_scopes: ["lokate_read"])

  """Your phones (installs) that have backed up here."""
  devices(filters: DeviceFilter, ordering: [DeviceOrder!]! = [], pagination: OffsetPaginationInput): [Device!]! @auth(required_scopes: ["lokate_read"])

  """A device by id."""
  device(id: ID!): Device! @auth(required_scopes: ["lokate_read"])

  """
  Location fixes (paginated, filterable by time, device, box or distance).
  """
  points(filters: PointFilter, ordering: [PointOrder!]! = [], pagination: OffsetPaginationInput): [Point!]! @auth(required_scopes: ["lokate_read"])

  """How many points match (the same filters as `points`)."""
  pointsCount(filters: PointFilter = null): Int! @auth(required_scopes: ["lokate_read"])

  """A point by id."""
  point(id: ID!): Point! @auth(required_scopes: ["lokate_read"])

  """Stays (paginated, filterable by time, device, place, box or distance)."""
  visits(filters: VisitFilter, ordering: [VisitOrder!]! = [], pagination: OffsetPaginationInput): [Visit!]! @auth(required_scopes: ["lokate_read"])

  """How many visits match (the same filters as `visits`)."""
  visitsCount(filters: VisitFilter = null): Int! @auth(required_scopes: ["lokate_read"])

  """A visit by id."""
  visit(id: ID!): Visit! @auth(required_scopes: ["lokate_read"])

  """
  Movements between visits (paginated, filterable by time, device, mode or distance).
  """
  trips(filters: TripFilter, ordering: [TripOrder!]! = [], pagination: OffsetPaginationInput): [Trip!]! @auth(required_scopes: ["lokate_read"])

  """How many trips match (the same filters as `trips`)."""
  tripsCount(filters: TripFilter = null): Int! @auth(required_scopes: ["lokate_read"])

  """A trip by id."""
  trip(id: ID!): Trip! @auth(required_scopes: ["lokate_read"])

  """Your named places (paginated, filterable by name, box or distance)."""
  places(filters: PlaceFilter, ordering: [PlaceOrder!]! = [], pagination: OffsetPaginationInput): [Place!]! @auth(required_scopes: ["lokate_read"])

  """A place by id."""
  place(id: ID!): Place! @auth(required_scopes: ["lokate_read"])

  """
  One calendar day (in `timezone`, IANA name): its visits and trips in order, and totals.
  """
  day(date: Date!, timezone: String = "UTC"): Day! @auth(required_scopes: ["lokate_read"])

  """Your path between `since` and `until`, one GeoJSON line per device."""
  route(
    since: DateTime!
    until: DateTime!
    devices: [ID!] = null

    """Tolerance in meters for thinning the line (none: every point)."""
    simplify: Float = null

    """Leave out fixes less accurate than this (meters)."""
    maxAccuracy: Float = null
  ): [Track!]! @auth(required_scopes: ["lokate_read"])

  """Points, visits, trips and distance per day, week or month."""
  stats(since: DateTime!, until: DateTime!, granularity: Granularity = DAY, timezone: String = "UTC"): [StatsBucket!]! @auth(required_scopes: ["lokate_read"])

  """Time spent per place, most first."""
  placeStats(since: DateTime = null, until: DateTime = null, limit: Int = 100): [PlaceStat!]! @auth(required_scopes: ["lokate_read"])

  """The calling device's watermarks."""
  syncState: SyncState! @auth(required_scopes: ["lokate_read"])

  """
  Everything of yours, from all your devices, changed after `cursor`, oldest first (limit at most 1000). Page until hasMore is false; used to restore.
  """
  changes(cursor: String = null, limit: Int = 1000): ChangeSet! @auth(required_scopes: ["lokate_read"])
}

