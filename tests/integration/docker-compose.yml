services:
  redis:
    image: redis:latest
  db:
    # daten carries PostGIS, which lokate's generated geom columns need.
    image: jhnnsrs/daten:next
    restart: always
    command: postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off
    environment:
      POSTGRES_MULTIPLE_DATABASES: lokate
      POSTGRES_PASSWORD: hello_django
      POSTGRES_USER: hello_django
  lokate:
    depends_on:
    - redis
    - db
    image: jhnnsrs/lokate:${LOKATE_SERVICE_TAG:-latest}
    command: bash run-debug.sh
    stop_grace_period: 1s
    ports:
    - "${LOKATE_HOST_PORT:-6895}:80"
    volumes:
    - ./configs/lokate.yaml:/workspace/config.yaml
